<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Forum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        .forum-container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Post Card Styling */
        .post-card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
        }

        .category-badge {
            background-color: #007bff;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .post-title {
            margin: 0 0 10px 0;
            color: #222;
        }

        .post-body {
            color: #444;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* Metadata / Tags Styling */
        .tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .tag-pill {
            background-color: #eef2f7;
            color: #334e68;
            font-size: 0.8em;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #d9e2ec;
        }
    </style>
</head>
<body>

    <div class="forum-container">
        <h1>Community Forum</h1>
        
        <!-- Target container where JavaScript will inject posts -->
        <div id="postsFeed"></div>
    </div>

    <!-- Link your JS file -->
    <script src="testPost.js"></script>
</body>
</html>
