
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t community-forum-ci .

      - name: Run Java tests inside Docker
        run: docker run --rm community-forum-ci java -cp classes ForumPostSmokeTest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint JavaScript
        run: |
          npx --yes eslint@9.39.1 --no-config-lookup \
            --global crypto --global document \
            --global window --global alert \
            --rule 'no-undef:error' \
            --rule 'no-unreachable:error' \
            "Code/Post With Features and History/Post With Features and History/testPost.js"

