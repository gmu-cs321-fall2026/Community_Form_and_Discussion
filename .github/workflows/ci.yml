
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint JavaScript
        run: |
          npx --yes eslint@9.39.1 --no-config-lookup \
            --global crypto --global document \
            --global window --global alert \
            --rule 'no-undef:error' \
            --rule 'no-unreachable:error' \
            "Code/Post With Features and History/Post With Features and History/testPost.js"

      - name: Compile and lint Java
        run: |
          mkdir -p build/ci
          javac -Xlint:deprecation,unchecked -Werror -d build/ci \
            "Code/Post With Features and History/Post With Features and History/ForumPost.java" \
            "Code/Moderation Queue/ModerationWebServer.java" \
            tests/ForumPostSmokeTest.java

      - name: Run automated tests
        run: java -cp build/ci ForumPostSmokeTest
